<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif;color:#1A1426;background:#fff}
.sc{display:flex;position:fixed;inset:0;flex-direction:column;background:radial-gradient(120% 55% at 50% 0,#FFE3F3 0,#FFF6FB 45%,#fff 75%);padding:28px 16px calc(16px + env(safe-area-inset-bottom))}
.b{flex:1;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.sp{flex:1;min-height:12px}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lang{display:flex;align-items:center;gap:5px;border:0;background:#E8E4F0;color:#665E75;font-size:13px;font-weight:700;border-radius:999px;padding:7px 14px;cursor:pointer;transition:background-color .15s}
.lang:active{background:#DDD8E6}
.lang svg{width:16px;height:16px}
.close{width:36px;height:36px;border-radius:50%;border:0;background:#E8E4F0;color:#665E75;font-size:20px;line-height:36px;text-align:center;cursor:pointer;transition:background-color .15s}
.close:active{background:#DDD8E6}

/* edu */
.ann{width:64px;height:64px;margin:0 auto 28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ann svg{width:30px;height:30px}
.ann.pink{background:#FFE3F3;color:#D9008D}
.h{text-align:center;font-size:clamp(21px,7.6vw,28px);font-weight:800;line-height:1.4;letter-spacing:-.01em;margin:0 -4px 10px;padding:0 4px}.h .nw{white-space:nowrap}.h .hl{color:#D9008D;white-space:nowrap}
.sub{text-align:center;font-size:18px;line-height:1.5;color:#443D54;margin:0 12px 20px}

/* phone card */
.phone{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid #F0EAF4;border-radius:16px;padding:16px 18px;text-decoration:none;color:#1A1426;box-shadow:0 4px 14px rgba(26,20,38,.06);margin:0 4px 4px;transition:background-color .15s,transform .12s}
.phone:active{transform:scale(.985);background:#FFF6FB}
.phone .ph-ico{flex:none;width:44px;height:44px;border-radius:12px;background:#FFE3F3;display:flex;align-items:center;justify-content:center}
.phone .ph-ico svg{width:22px;height:22px;color:#D9008D}
.phone .ph-txt{flex:1}
.phone .ph-lbl{display:block;font-size:13.5px;color:#665E75;font-weight:600;margin-bottom:2px}
.phone .ph-num{display:block;font-size:19px;font-weight:800;letter-spacing:.01em}
.phone .ph-arr{flex:none;color:#C5BDCF}
.phone .ph-arr svg{width:20px;height:20px}

.sc .b>*{animation:up .3s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div class="sc" id="edu">
<div class="topbar">
<button class="lang" id="langBtn" type="button" onclick="toggleLang()"><svg viewBox="0 0 24 24" fill="none"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z" fill="currentColor"/></svg>English</button>
<button class="close" id="x" type="button" aria-label="बंद करें" onclick="dismiss()">&#xd7;</button>
</div>
<div class="b">
<div class="sp"></div>
<div class="ann pink" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path fill="currentColor" d="M20.2 5.9l.8-.8C19.6 3.7 17.8 3 16 3s-3.6.7-5 2.1l.8.8C13 4.8 14.5 4.2 16 4.2s3 .6 4.2 1.7zm-1.5 1.5l.8-.8c-1-1-2.2-1.5-3.5-1.5s-2.6.5-3.5 1.5l.8.8c.7-.7 1.6-1.1 2.7-1.1s2 .4 2.7 1.1zM19 13h-2V9h-2v4H5c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2zM8 18H6v-2h2v2zm3.5 0h-2v-2h2v2zm3.5 0h-2v-2h2v2z"/></svg></div>
<div class="h" id="title"><span class="hl">कैरी फीस से बचें!</span><br>31 अक्टूबर तक रिटर्न मार्क किए गए नेट-बॉक्स व्योम को वापस करें।</div>
<div class="sub" id="subtitle">कॉल करके पिकअप शेड्यूल करें।<br>नेट-बॉक्स वापस नहीं करने पर कैरी फीस लगेगी।</div>
<div class="sp"></div>
</div>
<a class="phone" id="cta" href="tel:+917836811111" onclick="trackCall()">
<span class="ph-ico"><svg viewBox="0 0 24 24" fill="none"><path fill="currentColor" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></span>
<span class="ph-txt"><span class="ph-lbl" id="callLbl">अभी कॉल करें</span><span class="ph-num">+91 78368 11111</span></span>
<span class="ph-arr"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
</a>
</div>

<script>
var PREFIX='CSP_NetBoxReturn_';
var lang='hi';

var txt={
  hi:{
    title:'<span class="hl">कैरी फीस से बचें!</span><br>31 अक्टूबर तक रिटर्न मार्क किए गए नेट-बॉक्स व्योम को वापस करें।',
    sub:'कॉल करके पिकअप शेड्यूल करें।<br>नेट-बॉक्स वापस नहीं करने पर कैरी फीस लगेगी।',
    call:'अभी कॉल करें',
    toggle:'English'
  },
  en:{
    title:'<span class="hl">Avoid carry fee!</span><br>Return the Net-Box marked as returned to Wiom by 31 October.',
    sub:'Call to schedule a pickup.<br>Carry fee will be charged if the Net-Box is not returned.',
    call:'Call now',
    toggle:'हिन्दी'
  }
};

function toggleLang(){
  lang=(lang==='hi')?'en':'hi';
  var t=txt[lang];
  document.getElementById('title').innerHTML=t.title;
  document.getElementById('subtitle').innerHTML=t.sub;
  document.getElementById('callLbl').textContent=t.call;
  document.getElementById('langBtn').innerHTML='<svg viewBox="0 0 24 24" fill="none"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z" fill="currentColor"/></svg>'+t.toggle;
  document.documentElement.lang=(lang==='hi')?'hi':'en';
  track(PREFIX+'Lang_'+lang.toUpperCase());
}

function track(name,props){
  try{
    if(window.CleverTap&&window.CleverTap.pushEvent){
      if(props){window.CleverTap.pushEvent(name,JSON.stringify(props))}
      else{window.CleverTap.pushEvent(name)}
      return 1;
    }
    if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.clevertap){
      window.webkit.messageHandlers.clevertap.postMessage({action:'pushEvent',event:name,props:props||{}});
      return 1;
    }
  }catch(e){}
  return 0;
}

function cl(){try{if(window.CleverTap&&window.CleverTap.dismissInAppNotification){window.CleverTap.dismissInAppNotification();return}if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.clevertap){window.webkit.messageHandlers.clevertap.postMessage({action:'dismissInAppNotification'})}}catch(e){}}

function trackCall(){
  track(PREFIX+'Call_Tapped');
}

function dismiss(){
  track(PREFIX+'Cross_Clicked');
  cl();
}
</script>
</body></html>
